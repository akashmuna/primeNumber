name: Java Maven CI with Coverage

on: [push]

# Grant permission to let the workflow commit the badge back to your repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Runs Unit Tests, Integration Tests, and generates code coverage
      - name: Build and Test with Maven
        run: mvn clean verify

      # Generates the coverage badge SVG file from the JaCoCo CSV
      - name: Generate JaCoCo Badge
        id: jacoco
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: .github/badges
          generate-branches-badge: false

      # Automatically commits and pushes the badge file if it changed
      - name: Commit and Push Badge
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .github/badges/jacoco.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update coverage badge" && git push)